name: Gerar APK
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Testes e APK Debug
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publicar APK dos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-Remoto-alpha2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
